# Secret scan with TruffleHog on every pull request and every push to main.
# Scans only the new commits. Fails on secrets that are confirmed to work
# (verified) or could not be checked (unknown); ignores those that the
# provider rejected. False positives: list path regexes in
# .trufflehog-exclude.txt, or add the comment "trufflehog:ignore" on the line.
# What to do on a finding: docs/conventions.md in hxs-repo-template.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          version: 3.99.3
          extra_args: >-
            --results=verified,unknown
            ${{ hashFiles('.trufflehog-exclude.txt') != '' && '--exclude-paths=.trufflehog-exclude.txt' || '' }}
